# Project-wide Gradle settings.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the Gradle Daemon.
# The setting is particularly useful for optimizing libraries,
# enabling the daemon to run with more memory.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
org.gradle.parallel=true

# AndroidX is the new package structure for the Android Support Library.
android.useAndroidX=true

# Enables namespacing for each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Force Gradle to use a JDK compatible with AGP 8.13 / Gradle 9.3 and KSP 1.9.24.
# Android Studio's bundled JBR 25 is too new for this repo's Kotlin/KSP stack.
org.gradle.java.home=C:\\Program Files\\Microsoft\\jdk-17.0.20.101-hotspot
